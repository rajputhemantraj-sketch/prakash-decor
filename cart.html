<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | Prakash Decor</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <canvas id="particles-canvas"></canvas>
    <div class="top-banner">🪔 Diwali Mahotsav Sale is Live! | BUY 2 GET 1 FREE 🪔</div>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">Prakash Decor</a>
            <ul class="nav-links"><li><a href="index.html">Home</a></li><li><a href="shop.html">Shop</a></li></ul>
            <a href="cart.html" class="cart-icon">🛒 <span class="cart-count">0</span></a>
        </div>
    </header>

    <section class="container">
        <h1 class="section-title">Your Cart</h1>
        <div class="cart-layout">
            <div class="cart-items-section" id="cart-items-container"></div>

            <div class="checkout-section" id="checkout-form-container" style="display: none;">
                <h3>Order Summary</h3>
                <div style="margin: 15px 0;">
                    <div style="display:flex; justify-content:space-between;"><span>Subtotal:</span> <span id="summary-subtotal">₹0</span></div>
                    <div class="discount-row"><span>B2G1 Free Discount:</span> <span id="summary-discount">- ₹0</span></div>
                    <div class="total-row"><span>Total:</span> <span id="summary-total">₹0</span></div>
                    <p style="color:var(--primary-red); font-size:0.85rem; text-align:center; margin-top:10px;">
                        *Get an extra 5% discount if you pay via UPI/Prepaid!
                    </p>
                </div>
                
                <form class="checkout-form" onsubmit="submitOrder(event)">
                    <label>Full Name</label>
                    <input type="text" id="c-name" required>
                    <label>Phone Number</label>
                    <input type="tel" id="c-phone" required>
                    <label>Complete Address</label>
                    <textarea id="c-address" rows="3" required></textarea>
                    <button type="submit" class="btn primary-btn w-100" style="margin-top: 20px;">Place Order via WhatsApp</button>
                </form>
            </div>
        </div>
    </section>
    <script src="js/products.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
